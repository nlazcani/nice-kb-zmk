# nice_kb RIGHT — peripheral half. Keys only, no trackball.
#
# NOTE: ZMK loads user config as config/<shield>.conf. The shields are
# nice_kb_left / nice_kb_right, so config/nice_kb.conf was never loaded by
# either half. These per-half files replace it.

# ===== ZMK Studio =====
# Both halves share one keymap, and that keymap binds &studio_unlock. The
# behavior must be compiled in on this half too or the reference fails to link.
# There is no RPC transport here (no studio-rpc-usb-uart snippet), which is
# fine — Studio only ever talks to the central.
CONFIG_ZMK_STUDIO=y

# ===== Free NFC pins P0.09 (col3) & P0.10 for GPIO =====
CONFIG_NFCT_PINS_AS_GPIOS=y

# Deliberately absent: CONFIG_ZMK_POINTING / CONFIG_PMW3610_ALT / CONFIG_SPI.
# No sensor is populated on this half; nice_kb_right.overlay disables the
# trackball, its listener, and spi0.
