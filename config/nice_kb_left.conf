# nice_kb LEFT — central half (USB host, ZMK Studio, trackball).
#
# NOTE: ZMK loads user config as config/<shield>.conf. The shields are
# nice_kb_left / nice_kb_right, so config/nice_kb.conf was never loaded by
# either half. These per-half files replace it.

# ===== ZMK Studio (live keymap editing over USB, on central) =====
CONFIG_ZMK_STUDIO=y

# ===== Pointing / PMW3610 trackball (left half only) =====
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610_ALT=y

# ===== Free NFC pins P0.09 (col3) & P0.10 for GPIO =====
CONFIG_NFCT_PINS_AS_GPIOS=y
